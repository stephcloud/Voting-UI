<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Voting System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .font-display {
        font-family: "Space Grotesk", sans-serif;
      }
      .dot-pattern {
        background-color: #f4faf6;
        background-image: radial-gradient(
          rgba(16, 122, 74, 0.18) 1.5px,
          transparent 1.5px
        );
        background-size: 24px 24px;
      }
      .glow-card {
        background: #ffffff;
        border: 1px solid rgba(16, 122, 74, 0.18);
      }
      .accent-ring:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(16, 122, 74, 0.35);
      }
      .bar-fill {
        transition: width 0.6s ease;
      }
    </style>
  </head>
  <body class="dot-pattern min-h-screen text-emerald-950">
    <div class="flex justify-center items-center min-h-screen p-5">
      <div class="glow-card max-w-lg w-full rounded-3xl shadow-2xl p-8">
        <h1
          class="font-display text-4xl font-bold text-center text-emerald-700 tracking-tight"
        >
          ⬡ Digital Voting System
        </h1>
        <p class="text-center text-emerald-600/70 mt-1">
          Cast your vote securely
        </p>
        <p
          id="clock"
          class="text-center text-emerald-600 mt-3 font-semibold tracking-wide"
        ></p>

        <form id="voteForm" class="space-y-5 mt-6">
          <div>
            <label class="font-semibold text-emerald-800 text-sm"
              >Voter's Name</label
            >
            <input
              type="text"
              id="voterName"
              required
              placeholder="Enter your name"
              class="w-full bg-white border border-emerald-200 rounded-xl p-3 mt-1 text-emerald-950 placeholder-emerald-400 accent-ring"
            />
          </div>
          <div>
            <label class="font-semibold text-emerald-800 text-sm"
              >Choose Candidate</label
            >
            <select
              id="candidate"
              required
              class="w-full bg-white border border-emerald-200 rounded-xl p-3 mt-1 text-emerald-950 accent-ring"
            >
              <option value="">Select Candidate</option>
              <option value="Amara">Amara</option>
              <option value="Rita">Rita</option>
              <option value="Loveth">Loveth</option>
              <option value="Steph">Steph</option>
            </select>
          </div>
          <button
            type="submit"
            class="w-full bg-emerald-600 text-white p-3 rounded-xl font-semibold hover:bg-emerald-700 transition-colors"
          >
            Vote
          </button>
        </form>

        <div class="mt-8">
          <h2 class="font-display font-bold text-xl text-emerald-700">
            ◆ Leaderboard
          </h2>
          <div id="leaderboard" class="space-y-2 mt-2"></div>
        </div>
      </div>
    </div>

    <div class="fixed bottom-6 left-6 glow-card rounded-xl p-5 w-56 shadow-xl">
      <h2 class="font-display font-bold text-emerald-700 mb-2">
        Votes Per Candidate
      </h2>
      <p class="flex justify-between text-emerald-900">
        <span>Amara</span
        ><span id="AmaraVotes" class="text-emerald-600 font-semibold">0</span>
      </p>
      <p class="flex justify-between text-emerald-900">
        <span>Rita</span
        ><span id="RitaVotes" class="text-emerald-600 font-semibold">0</span>
      </p>
      <p class="flex justify-between text-emerald-900">
        <span>Loveth</span
        ><span id="LovethVotes" class="text-emerald-600 font-semibold">0</span>
      </p>
      <p class="flex justify-between text-emerald-900">
        <span>Steph</span
        ><span id="StephVotes" class="text-emerald-600 font-semibold">0</span>
      </p>
    </div>

    <div
      class="fixed bottom-6 right-6 bg-emerald-600 text-white rounded-xl shadow-xl p-5 w-52"
    >
      <h2 class="font-display font-bold">Total Votes</h2>
      <p id="totalVotes" class="text-5xl text-center font-display">0</p>
    </div>

    <!-- Winner -->
    <div
      id="winnerModal"
      class="hidden fixed inset-0 bg-emerald-950/60 flex justify-center items-center"
    >
      <div
        class="glow-card p-8 rounded-3xl text-center border border-emerald-300"
      >
        <h2 class="font-display text-3xl text-emerald-700 font-bold">
          ⬡ Winner
        </h2>
        <p id="winnerName" class="text-2xl mt-5 text-emerald-950"></p>
        <button
          id="closeModal"
          class="bg-emerald-600 text-white px-6 py-3 rounded-xl mt-6 font-semibold hover:bg-emerald-700 transition-colors"
        >
          Close
        </button>
      </div>
    </div>

    <script>
      localStorage.clear();
      let votes = {
        Amara: 0,
        Rita: 0,
        Loveth: 0,
        Steph: 0,
      };
      const voters = new Set();
      const form = document.getElementById("voteForm");
      const voterName = document.getElementById("voterName");
      const candidate = document.getElementById("candidate");
      const totalVotes = document.getElementById("totalVotes");
      const AmaraVotes = document.getElementById("AmaraVotes");
      const RitaVotes = document.getElementById("RitaVotes");
      const LovethVotes = document.getElementById("LovethVotes");
      const StephVotes = document.getElementById("StephVotes");
      const winnerModal = document.getElementById("winnerModal");
      const winnerName = document.getElementById("winnerName");
      const closeModal = document.getElementById("closeModal");
      const leaderboard = document.getElementById("leaderboard");

      const barColors = {
        Amara: "bg-emerald-600",
        Rita: "bg-emerald-500",
        Loveth: "bg-emerald-400",
        Steph: "bg-lime-500",
      };

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        const name = voterName.value.trim();
        const selected = candidate.value;
        if (name === "" || selected === "") {
          alert("Complete the form.");
          return;
        }
        if (voters.has(name.toLowerCase())) {
          alert("You have already voted.");
          return;
        }
        voters.add(name.toLowerCase());
        votes[selected]++;
        updateVoteCount();
        showWinner();
        form.reset();
      });

      function updateVoteCount() {
        AmaraVotes.textContent = votes.Amara;
        RitaVotes.textContent = votes.Rita;
        LovethVotes.textContent = votes.Loveth;
        StephVotes.textContent = votes.Steph;
        const total = votes.Amara + votes.Rita + votes.Loveth + votes.Steph;
        totalVotes.textContent = total;
        updateLeaderboard(total);
      }

      function updateLeaderboard(total) {
        leaderboard.innerHTML = "";
        Object.entries(votes)
          .sort((a, b) => b[1] - a[1])
          .forEach(([name, score]) => {
            const pct = total > 0 ? Math.round((score / total) * 100) : 0;
            leaderboard.innerHTML += `
            <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-lg">
              <div class="flex justify-between text-sm text-emerald-900 mb-1">
                <span class="font-semibold">${name}</span>
                <span>${score}</span>
              </div>
              <div class="w-full bg-emerald-100 rounded-full h-2">
                <div class="bar-fill ${barColors[name]} h-2 rounded-full" style="width:${pct}%"></div>
              </div>
            </div>
            `;
          });
      }

      function showWinner() {
        let winner = "";
        let highest = -1;
        for (let person in votes) {
          if (votes[person] > highest) {
            highest = votes[person];
            winner = person;
          }
        }
        winnerName.innerHTML = `
        <div class="text-6xl">⬡</div>
        <h2 class="font-display text-3xl font-bold text-emerald-700 mt-3">
        ${winner}
        </h2>
        <p class="text-xl mt-3 text-emerald-800">
        ${highest} Vote(s)
        </p>
        `;
        winnerModal.classList.remove("hidden");
      }

      closeModal.addEventListener("click", function () {
        winnerModal.classList.add("hidden");
      });

      const clock = document.getElementById("clock");
      setInterval(function () {
        clock.textContent = new Date().toLocaleTimeString();
      }, 1000);

      updateVoteCount();
    </script>
  </body>
</html>
