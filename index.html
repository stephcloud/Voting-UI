<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Voting System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <style>
    body {
      font-family: "Inter", sans-serif;
    }

    .font-display {
      font-family: "Space Grotesk", sans-serif;
    }

    .dot-pattern {
      background-color: #f4faf6;
      background-image: radial-gradient(rgba(16, 122, 74, 0.18) 1.5px,
          transparent 1.5px);
      background-size: 24px 24px;
    }

    .glow-card {
      background: #ffffff;
      border: 1px solid rgba(16, 122, 74, 0.18);
    }

    .accent-ring:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(16, 122, 74, 0.35);
    }

    .bar-fill {
      transition: width 0.6s ease;
    }
  </style>
</head>

<body class="dot-pattern min-h-screen text-emerald-950">
  <div class="flex flex-col items-center min-h-screen p-5">
    <div class="glow-card max-w-lg w-full rounded-3xl shadow-2xl p-8 mt-6">
      <h1 class="font-display text-4xl font-bold text-center text-emerald-700 tracking-tight">
        Digital Voting System
      </h1>
      <p class="text-center text-emerald-600/70 mt-1">
        Cast your vote securely
      </p>
      <p id="clock" class="text-center text-emerald-600 mt-3 font-semibold tracking-wide"></p>

      <form id="voteForm" class="space-y-5 mt-6">
        <div>
          <label class="font-semibold text-emerald-800 text-sm">Voter's Name</label>
          <input type="text" id="voterName" required placeholder="Enter your name"
            class="w-full bg-white border border-emerald-200 rounded-xl p-3 mt-1 text-emerald-950 placeholder-emerald-400 accent-ring" />
        </div>
        <div>
          <label class="font-semibold text-emerald-800 text-sm">Choose Candidate</label>
          <select id="candidate" required
            class="w-full bg-white border border-emerald-200 rounded-xl p-3 mt-1 text-emerald-950 accent-ring">
            <option value="">Select Candidate</option>
            <option value="Amara">Amara</option>
            <option value="Rita">Rita</option>
            <option value="Loveth">Loveth</option>
            <option value="Steph">Steph</option>
          </select>
        </div>
        <button type="submit"
          class="w-full bg-emerald-600 text-white p-3 rounded-xl font-semibold hover:bg-emerald-700 transition-colors">
          Vote
        </button>
      </form>

      <div class="mt-8">
        <h2 class="font-display font-bold text-xl text-emerald-700">
          Leaderboard
        </h2>
        <div id="leaderboard" class="space-y-2 mt-2"></div>
      </div>
    </div>

    <div
      class="w-full max-w-lg mt-6 lg:max-w-none lg:fixed lg:bottom-6 lg:left-6 lg:w-56 glow-card rounded-xl p-5 shadow-xl">
      <h2 class="font-display font-bold text-emerald-700 mb-2">
        Votes Per Candidate
      </h2>
      <p class="flex justify-between text-emerald-900">
        <span>Amara</span><span id="AmaraVotes" class="text-emerald-600 font-semibold">0</span>
      </p>
      <p class="flex justify-between text-emerald-900">
        <span>Rita</span><span id="RitaVotes" class="text-emerald-600 font-semibold">0</span>
      </p>
      <p class="flex justify-between text-emerald-900">
        <span>Loveth</span><span id="LovethVotes" class="text-emerald-600 font-semibold">0</span>
      </p>
      <p class="flex justify-between text-emerald-900">
        <span>Steph</span><span id="StephVotes" class="text-emerald-600 font-semibold">0</span>
      </p>
    </div>

    <div
      class="w-full max-w-lg mt-4 mb-6 lg:max-w-none lg:fixed lg:bottom-6 lg:right-6 lg:w-52 bg-emerald-600 text-white rounded-xl shadow-xl p-5">
      <h2 class="font-display font-bold">Total Votes</h2>
      <p id="totalVotes" class="text-5xl text-center font-display">0</p>
    </div>
  </div>

  <!-- Winner -->
  <div id="winnerModal" class="hidden fixed inset-0 bg-emerald-950/60 flex justify-center items-center">
    <div class="glow-card p-8 rounded-3xl text-center border border-emerald-300">
      <h2 class="font-display text-3xl text-emerald-700 font-bold">
        ⬡ Winner
      </h2>
      <p id="winnerName" class="text-2xl mt-5 text-emerald-950"></p>
      <button id="closeModal"
        class="bg-emerald-600 text-white px-6 py-3 rounded-xl mt-6 font-semibold hover:bg-emerald-700 transition-colors">
        Close
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
